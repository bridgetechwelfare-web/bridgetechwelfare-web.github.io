<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Tech Welfare - Plugins & Tools</title>
<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }
body { margin:0; background:#0f172a; color:white; }
header { padding:20px; text-align:center; background:#1e293b; }
header h1 { margin:0; font-size:26px; color:#38bdf8; }
header p { color:#cbd5e1; }
.search-box { padding:15px; text-align:center; }
.search-box input { width:90%; max-width:500px; padding:12px; border-radius:10px; border:none; font-size:16px; }
.filters { text-align:center; padding:0 10px 10px; }
.filters button { padding:8px 15px; margin:4px; border:none; border-radius:20px; background:#334155; color:white; cursor:pointer; }
.filters button.active { background:#38bdf8; color:black; }
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:15px; padding:15px; }
.card { background:#1e293b; border-radius:15px; padding:15px; }
.card h3 { margin:0 0 5px; }
.card span { font-size:12px; background:#38bdf8; color:black; padding:3px 8px; border-radius:10px; }
.card p { color:#cbd5e1; font-size:14px; min-height:40px; }
.card a { display:block; text-align:center; background:#22c55e; color:white; padding:10px; border-radius:10px; text-decoration:none; font-weight:bold; margin-top:10px; }
#adminPanel { display:none; padding:20px; background:white; color:black; }
#adminPanel input, #adminPanel textarea, #adminPanel select { width:100%; padding:10px; margin:6px 0; border:1px solid #ccc; border-radius:8px; }
#adminPanel button { padding:12px; width:100%; background:#0ea5e9; color:white; border:none; border-radius:8px; font-size:16px; }
footer { text-align:center; padding:15px; color:#94a3b8; font-size:13px; }
</style>
</head>
<body>

<header>
<h1>Bridge Tech Welfare</h1>
<p>Blind Users Ke Liye Free Plugins, Tools & Screen Readers</p>
</header>

<div class="search-box">
<input type="text" id="search" placeholder="Search Plugin... Jieshuo, NVDA..." onkeyup="render()">
</div>

<div class="filters" id="filters"></div>

<div id="adminPanel">
<h2>Secret Admin Panel</h2>
<p>Yahan Naya Plugin Add Karo - Drive Link Yahan Lagao</p>
<input type="text" id="title" placeholder="Title - Jese: Jieshuo Screen Reader">
<select id="category">
<option>Applications</option>
<option>Extensions</option>
<option>Tools</option>
<option>Add-Ons</option>
<option>Screen Readers</option>
</select>
<textarea id="desc" placeholder="Description - Ye plugin kis kaam aata hai?"></textarea>
<input type="text" id="link" placeholder="Link - Yahan Drive / Website Link Paste Karo">
<button onclick="addItem()">Save Plugin</button>
</div>

<div class="grid" id="list"></div>
<footer>Bridge Tech Welfare | Made For Blind Community ❤️</footer>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
// Firebase Config - Aapka bridgetech-welfare Project
const firebaseConfig = {
  apiKey: "AIzaSyD5AWr7FDOUPLUtcbhoMgztIYupXqIaes8",
  authDomain: "bridgetech-welfare.firebaseapp.com",
  projectId: "bridgetech-welfare",
  storageBucket: "bridgetech-welfare.firebasestorage.app",
  messagingSenderId: "271765569707",
  appId: "1:271765569707:web:10865d27fe8a9f154377ee",
  measurementId: "G-QWNZGMGL72"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let data = [];
let currentFilter = "All";
let isAdmin = new URLSearchParams(location.search).get('admin') === 'rafay123';
document.getElementById('adminPanel').style.display = isAdmin ? 'block' : 'none';

// Data Load Karo Firebase Se
db.collection("plugins").orderBy("createdAt","desc").onSnapshot((snap)=>{
  data = [];
  snap.forEach(doc=>{
    let d = doc.data(); d.id = doc.id; data.push(d);
  });
  // Agar Firebase Bilkul Khali Hai To Default Daal Do
  if(data.length===0){
    db.collection("plugins").add({title:"Jieshuo Screen Reader", category:"Screen Readers", desc:"Best Screen Reader For Android, TalkBack Ka Best Alternative.", link:"https://accessibleandroid.com/jieshuo-screen-reader/", createdAt: Date.now()});
    db.collection("plugins").add({title:"NVDA Screen Reader", category:"Screen Readers", desc:"Free Screen Reader For Windows Computer.", link:"https://www.nvaccess.org/download/", createdAt: Date.now()});
  }
  render();
});

function render(){
  let q = document.getElementById('search').value.toLowerCase();
  let cats = ["All", ...new Set(data.map(x=>x.category))];
  document.getElementById('filters').innerHTML = cats.map(c=>`<button class="${c===currentFilter?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('');
  let filtered = data.filter(x => (currentFilter==="All" || x.category===currentFilter) && x.title.toLowerCase().includes(q));
  document.getElementById('list').innerHTML = filtered.map((item)=>{
    return `<div class="card">
      <span>${item.category}</span>
      <h3 style="margin-top:10px">${item.title}</h3>
      <p>${item.desc}</p>
      <a href="${item.link}" target="_blank">Download Karo</a>
      ${isAdmin ? `<button onclick="deleteItem('${item.id}')" style="padding:8px;width:100%;border:none;border-radius:8px;color:white;margin-top:5px;background:#ef4444">Delete</button>` : ''}
    </div>`}).join('') || '<p style="text-align:center">Kuch Nahi Mila</p>';
}
function setFilter(c){ currentFilter=c; render(); }
function addItem(){
  let t = document.getElementById('title').value;
  let c = document.getElementById('category').value;
  let d = document.getElementById('desc').value;
  let l = document.getElementById('link').value;
  if(!t || !l){ alert("Title aur Link zaroori hai bhai!"); return; }
  db.collection("plugins").add({title:t, category:c, desc:d, link:l, createdAt: Date.now()}).then(()=>{
    alert("Ho Gaya Bhai! Firebase Me Save Ho Gaya");
    document.getElementById('title').value=''; document.getElementById('desc').value=''; document.getElementById('link').value='';
  });
}
function deleteItem(id){
  if(confirm("Delete kar dun bhai?")){ db.collection("plugins").doc(id).delete(); }
}
</script>
</body>
</html>
