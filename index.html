<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Tech Welfare</title>
<style>
body{font-family:Arial; padding:20px; background:#f2f2f2; text-align:center}
.box{background:white; padding:20px; border-radius:10px; max-width:400px; margin:auto}
input{width:90%; padding:12px; margin:8px 0; font-size:18px}
button{width:95%; padding:14px; font-size:19px; background:#0b6e4f; color:white; border:none; border-radius:8px}
h1{font-size:24px}
</style>
</head>
<body>
<div class="box">
<h1>Bridge Tech Welfare</h1>
<p>Sign Up</p>
<label for="name">Name</label><br>
<input id="name" type="text" placeholder="Apna Naam"><br>
<label for="phone">Mobile Number</label><br>
<input id="phone" type="tel" placeholder="0300-1234567"><br>
<label for="email">Email</label><br>
<input id="email" type="email" placeholder="Email"><br>
<label for="password">Password</label><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="signup()">Sign Up</button>
<p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5AWr7FDOUPLUtcbhoMgztIYupXqIaes8",
  authDomain: "bridgetech-welfare.firebaseapp.com",
  projectId: "bridgetech-welfare",
  storageBucket: "bridgetech-welfare.firebasestorage.app",
  messagingSenderId: "271765569707",
  appId: "1:271765569707:web:10865d27fe8a9f154377ee",
  measurementId: "G-QWNZGMGL72"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.signup = async function(){
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");
  try{
    const user = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, "users", user.user.uid), {
      name: name,
      phone: phone,
      email: email,
      createdAt: new Date()
    });
    msg.innerText = "Ho gaya! Sign Up kamyab ho gaya.";
  }catch(e){
    msg.innerText = "Error: " + e.message;
  }
}
</script>
</body>
</html>
