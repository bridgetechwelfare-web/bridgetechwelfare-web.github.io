<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Bridge Tech Welfare official member portal. Login to access free tools, apps, courses and community links.">
<meta name="theme-color" content="#0f2a6b">
<title>Bridge Tech Welfare | Official Member Portal</title>
<style>
  :root {    
    --blue-900: #0b1f4d;    
    --blue-700: #0f2a6b;    
    --blue-500: #1a56db;    
    --green-600: #15803d;    
    --ink: #0f172a;    
    --muted: #475569;    
    --line: #e2e8f0;    
    --danger: #b91c1c;    
    --focus: #f59e0b;    
    --radius: 14px;  
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {    
    margin: 0;    
    font-family: "Segoe UI", Tahoma, system-ui, -apple-system, Arial, sans-serif;    
    line-height: 1.55;    
    color: var(--ink);    
    background: radial-gradient(1100px 560px at 8% 0%, #dbeafe 0%, transparent 55%),      
                radial-gradient(900px 520px at 100% 100%, #dcfce7 0%, transparent 50%),
                #eef2f7;    
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: var(--radius);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(0, 0, 0, 0.03);
    padding: 30px;
    border: 1px solid var(--line);
  }
  .logo-area {
    text-align: center;
    margin-bottom: 24px;
  }
  .logo-area h1 {
    font-size: 22px;
    color: var(--blue-700);
    margin: 0 0 6px 0;
  }
  .logo-area p {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }
  /* Buttons container instead of tabs */
  .auth-buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  .auth-btn {
    flex: 1;
    padding: 12px;
    text-align: center;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 2px solid var(--blue-700);
  }
  .auth-btn.login {
    background: var(--blue-700);
    color: #ffffff;
  }
  .auth-btn.login:hover {
    background: var(--blue-900);
  }
  .auth-btn.register {
    background: transparent;
    color: var(--blue-700);
  }
  .auth-btn.register:hover {
    background: #f1f5f9;
  }
  .links-section {
    margin-top: 20px;
    border-top: 1px solid var(--line);
    padding-top: 20px;
    text-align: center;
  }
  .links-section a {
    display: inline-block;
    color: var(--blue-500);
    text-decoration: none;
    font-weight: 500;
    margin: 6px 12px;
    font-size: 14px;
  }
  .links-section a:hover {
    text-decoration: underline;
  }
  .footer-text {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 20px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo-area">
      <h1>Bridge Tech Welfare</h1>
      <p>Official Member Portal</p>
    </div>

    <!-- Login & Create Account Buttons (Replaced Tabs) -->
    <div class="auth-buttons">
      <a href="#login" class="auth-btn login" onclick="alert('Login form integration goes here.')">Login</a>
      <a href="#register" class="auth-btn register" onclick="alert('Registration form integration goes here.')">Create Account</a>
    </div>

    <!-- Community & Useful Links -->
    <div class="links-section">
      <a href="https://chat.whatsapp.com/CDkyuCcPVyEIAkW87j644n" target="_blank">WhatsApp Community</a>
      <a href="https://bridgetechwelfare-web.github.io/" target="_blank">Portal Home</a>
    </div>
  </div>

  <div class="footer-text">
    &copy; 2026 Bridge Tech Welfare. All rights reserved.
  </div>

</body>
</html>
